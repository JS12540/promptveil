lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:
  .:
    devDependencies:
      '@types/node':
        specifier: 22.10.5
        version: 22.10.5
      typescript:
        specifier: 5.9.3
        version: 5.9.3

  adapters/claude-code: {}

  adapters/codex: {}

  adapters/cursor: {}

  apps/cli:
