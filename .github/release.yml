changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security and privacy
      labels:
        - security
        - privacy
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - '*'
